services:
  mariadb:
    image : mariadb
    container_name: mariadb
    build: ./requirements/mariadb
    env_file:
      - .env
    volumes:
      - mariadb_vol:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped

  wordpress:
    image: wordpress
    container_name: wordpress
    build: ./requirements/wordpress
    env_file:
      - .env
    volumes:
      - wordpress_vol:/var/www/html
    networks:
      - inception
    restart: unless-stopped
    depends_on:
      - mariadb

  nginx:
    image: nginx
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_vol:/var/www/html
    networks:
      - inception
    restart: unless-stopped
    depends_on:
      - wordpress

volumes:
  mariadb_vol:
    name: mariadb-vol
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aohssine/data/mariadb
  wordpress_vol:
    name: wordpress-vol
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aohssine/data/wordpress
      
networks:
  inception:
    driver: bridge
